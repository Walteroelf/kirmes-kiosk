name: Geld-Erkennung testen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Künstliche Szenen auswerten
        run: node tests/test.js
      - name: Echte Spielgeld-Fotos auswerten
        run: npm install --no-save --no-package-lock jpeg-js@0.4.4 && node tests/fotos.js
